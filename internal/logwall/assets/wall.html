<!doctype html>
<html lang="en" data-theme="cyan" data-layout="hud">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChitChat // Live Wall</title>
<style>
/* ---------- themes (auto rotated) ---------- */
:root{
  --font:"Cascadia Code","Consolas","JetBrains Mono","Fira Code","DejaVu Sans Mono",monospace;
  --bg:#03070c; --panel:rgba(4,12,20,.55); --line:rgba(0,229,255,.28);
  --c:#00e5ff; --c2:#4dffd2; --txt:#cfe9f3; --dim:rgba(207,233,243,.55);
  --danger:#ff2a4d; --warn:#ffb000; --gold:#ffd24d; --ok:#39ff14;
  --user:#ff5fd2; --rain:0,229,255; --rain-a:.18; --glow:0 0 12px rgba(0,229,255,.55);
}
[data-theme="matrix"]{--bg:#020803;--panel:rgba(2,14,4,.6);--line:rgba(57,255,20,.3);--c:#39ff14;--c2:#9dff7a;--txt:#d3ffd0;--dim:rgba(211,255,208,.5);--user:#e7ff5a;--rain:57,255,20;--rain-a:.3;--glow:0 0 12px rgba(57,255,20,.6)}
[data-theme="crimson"]{--bg:#0a0205;--panel:rgba(22,3,8,.6);--line:rgba(255,42,77,.32);--c:#ff2a4d;--c2:#ff8da1;--txt:#ffe1e6;--dim:rgba(255,225,230,.5);--user:#ffb14d;--gold:#ffd24d;--rain:255,42,77;--rain-a:.16;--glow:0 0 12px rgba(255,42,77,.6)}
[data-theme="amber"]{--bg:#0a0600;--panel:rgba(22,13,0,.6);--line:rgba(255,176,0,.3);--c:#ffb000;--c2:#ffd56a;--txt:#fff1cc;--dim:rgba(255,241,204,.5);--user:#7df9ff;--rain:255,176,0;--rain-a:.14;--glow:0 0 12px rgba(255,176,0,.6)}
[data-theme="violet"]{--bg:#070314;--panel:rgba(14,5,30,.6);--line:rgba(177,76,255,.32);--c:#b14cff;--c2:#ff6bd6;--txt:#eadfff;--dim:rgba(234,223,255,.5);--user:#5af2ff;--rain:177,76,255;--rain-a:.18;--glow:0 0 12px rgba(177,76,255,.6)}
[data-theme="ice"]{--bg:#02070f;--panel:rgba(4,12,26,.6);--line:rgba(120,190,255,.3);--c:#8ec9ff;--c2:#ffffff;--txt:#e6f2ff;--dim:rgba(230,242,255,.5);--user:#ffd27a;--rain:142,201,255;--rain-a:.15;--glow:0 0 12px rgba(142,201,255,.6)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;transition:background .8s}
body{display:flex;flex-direction:column;position:relative}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line)}

/* ---------- background layers ---------- */
#bg-stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#bg-stage img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;object-position:center 22%;opacity:0;
  filter:grayscale(.55) brightness(.34) contrast(1.15) saturate(.7);
  transition:opacity 2.5s ease;animation:kenburns 60s ease-in-out infinite alternate}
#bg-stage img.show{opacity:.46}
#bg-stage img.b{animation-direction:alternate-reverse}
#bg-tint{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.35;
  background:radial-gradient(60% 70% at 50% 45%,rgba(var(--rain),.35),transparent 70%)}
#bg-shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 35%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.8))}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1%)}}
#rain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:var(--rain-a)}
#fx-grid{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.14;
  background-image:linear-gradient(rgba(var(--rain),.5) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--rain),.5) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%)}
#fx-scan{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
#fx-scan::after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;
  background:linear-gradient(180deg,transparent,rgba(var(--rain),.08),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{top:110%}}
#fx-vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 180px rgba(0,0,0,.85),inset 0 0 40px rgba(var(--rain),.08)}
body.flicker #fx-scan{animation:flick .12s steps(2) 3}
@keyframes flick{50%{opacity:.5}}

/* ---------- common HUD bits ---------- */
header,main,footer{position:relative;z-index:5}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);position:relative}
.panel::before,.panel::after,.tile::before,.tile::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--c);pointer-events:none}
.panel::before,.tile::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after,.tile::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.panel-title{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--c);border-bottom:1px solid var(--line);text-shadow:var(--glow)}
.panel-title small{margin-left:auto;letter-spacing:.1em;color:var(--dim);font-size:10px}
.panel-title i{width:8px;height:8px;background:var(--c);box-shadow:var(--glow);display:inline-block;transform:rotate(45deg)}

header#top{display:flex;align-items:center;gap:26px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(var(--rain),.12),transparent 50%,rgba(var(--rain),.08));font-size:12px;letter-spacing:.14em}
.brand{font-size:16px;font-weight:700;letter-spacing:.34em;color:var(--c);text-shadow:var(--glow);white-space:nowrap}
.brand em{font-style:normal;color:var(--c2);opacity:.8}
.brand .logo{display:inline-block;animation:spin 8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:#555}
body.online .dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s ease-in-out infinite}
body.online #status-text{color:var(--ok)}
body:not(.online) #status-text{color:var(--danger)}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.clock{margin-left:auto;text-align:right;line-height:1.1}
#clock{font-size:26px;font-weight:700;color:var(--c);text-shadow:var(--glow);letter-spacing:.08em}
#date{display:block;font-size:10px;color:var(--dim)}
.meta{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim);text-align:right;min-width:150px}
.meta b{color:var(--c);font-weight:600}
#hex{font-size:10px;color:var(--dim);letter-spacing:.12em;opacity:.7;white-space:nowrap}

/* ---------- stats tiles ---------- */
#stats{display:grid;gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px 14px 10px;overflow:hidden;backdrop-filter:blur(6px);transition:transform .3s}
.tile .lbl{font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.tile .val{font-size:34px;font-weight:700;line-height:1.1;color:var(--c);text-shadow:var(--glow);font-variant-numeric:tabular-nums;margin-top:4px}
.tile.danger .val,.tile.danger::before,.tile.danger::after{color:var(--danger);border-color:var(--danger);text-shadow:0 0 14px var(--danger)}
.tile.warn .val,.tile.warn::before,.tile.warn::after{color:var(--warn);border-color:var(--warn);text-shadow:0 0 14px var(--warn)}
.tile.gold .val,.tile.gold::before,.tile.gold::after{color:var(--gold);border-color:var(--gold);text-shadow:0 0 14px var(--gold)}
.tile.ok .val,.tile.ok::before,.tile.ok::after{color:var(--ok);border-color:var(--ok);text-shadow:0 0 14px var(--ok)}
.tile svg{position:absolute;right:10px;bottom:8px;width:84px;height:28px;opacity:.75}
.tile svg polyline{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.tile.danger svg{color:var(--danger)}.tile.warn svg{color:var(--warn)}.tile.gold svg{color:var(--gold)}.tile.ok svg{color:var(--ok)}.tile svg{color:var(--c)}
.tile .bar{height:2px;background:rgba(255,255,255,.08);margin-top:8px}
.tile .bar i{display:block;height:100%;width:0;background:currentColor;color:var(--c);box-shadow:var(--glow);transition:width 1s ease}
.tile.danger .bar i{color:var(--danger)}.tile.warn .bar i{color:var(--warn)}.tile.gold .bar i{color:var(--gold)}.tile.ok .bar i{color:var(--ok)}
.tile.bump{transform:scale(1.03)}
.tile.bump .val{animation:blink .5s steps(2) 2}
@keyframes blink{50%{opacity:.35}}

/* radar */
#radar{position:relative;height:140px;display:flex;align-items:center;justify-content:center}
#radar .ring{position:absolute;border:1px solid var(--line);border-radius:50%}
#radar .ring:nth-child(1){width:120px;height:120px}#radar .ring:nth-child(2){width:84px;height:84px}#radar .ring:nth-child(3){width:46px;height:46px}
#radar .sweep{position:absolute;width:120px;height:120px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(var(--rain),.55),transparent 70deg,transparent);animation:spin 3.5s linear infinite}
#radar .cross{position:absolute;width:120px;height:1px;background:var(--line)}
#radar .cross.v{transform:rotate(90deg)}
#radar .core{position:relative;font-size:22px;font-weight:700;color:var(--c);text-shadow:var(--glow)}
#radar .cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.3em;color:var(--dim)}
#radar .blip{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c2);box-shadow:0 0 8px var(--c2);animation:blipfade 3.5s linear infinite}
@keyframes blipfade{0%{opacity:1}60%{opacity:.1}100%{opacity:0}}

/* ---------- chat stream ---------- */
#stream{display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;gap:3px;max-width:68%;padding:8px 12px;border:1px solid var(--line);background:rgba(0,0,0,.35);position:relative;
  animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .who{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
.msg .who b{color:var(--c);font-weight:600}
.msg .text{font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg .time{font-size:9px;color:var(--dim);letter-spacing:.1em;align-self:flex-end}
.msg.send{align-self:flex-end;border-color:rgba(var(--rain),.55);background:linear-gradient(135deg,rgba(var(--rain),.16),rgba(0,0,0,.35))}
.msg.send .text{color:var(--c2)}
.msg.recv{align-self:flex-start;border-color:rgba(255,255,255,.12)}
.msg.recv .who b{color:var(--user)}
.msg.recv .text{color:var(--txt)}
.msg.sys{align-self:center;max-width:90%;border:0;background:transparent;text-align:center}
.msg.sys .text{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.msg.sys .text::before{content:"— "}.msg.sys .text::after{content:" —"}
.msg.snap{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,77,.35)}
.msg.snap .who::after{content:"★ SNAP";color:var(--gold);letter-spacing:.2em}
.msg.recv .arrow{color:var(--user)}.msg.send .arrow{color:var(--c)}
.msg.fresh{box-shadow:0 0 22px rgba(var(--rain),.35)}
.cursor::after{content:"▌";animation:caret .8s steps(1) infinite;color:var(--c)}
@keyframes caret{50%{opacity:0}}
#empty{margin:auto;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.3em;text-transform:uppercase;line-height:2}
#empty b{display:block;font-size:30px;color:var(--c);text-shadow:var(--glow);letter-spacing:.5em}

/* ---------- console ---------- */
footer#console{display:flex;flex-direction:column}
#sys{padding:8px 14px;font-size:11px;line-height:1.6;color:var(--dim);height:88px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#sys div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sys .l-error{color:var(--danger)}#sys .l-info{color:var(--dim)}#sys .l-activity{color:var(--c2)}
#sys div::before{content:"> ";color:var(--c)}
#sys div.last::after{content:"▌";animation:caret .8s steps(1) infinite;color:var(--c)}
.hint{padding:4px 14px 8px;font-size:9px;letter-spacing:.2em;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
.hint span b{color:var(--c)}

/* ---------- layouts ---------- */
main#hud{flex:1;min-height:0;display:grid;gap:12px;padding:12px 16px}
[data-layout="hud"] main#hud{grid-template-columns:280px 1fr}
[data-layout="hud"] #stats{grid-template-columns:1fr 1fr;align-content:start}
[data-layout="hud"] #stats .tile.wide{grid-column:span 2}
[data-layout="hud"] #radar-wrap{grid-column:span 2}
[data-layout="hud"] footer#console{margin:0 16px 12px}

[data-layout="terminal"] main#hud{grid-template-rows:auto 1fr;grid-template-columns:1fr}
[data-layout="terminal"] #stats{grid-template-columns:repeat(11,1fr);order:0}
[data-layout="terminal"] #stats .tile .val{font-size:22px}
[data-layout="terminal"] #stats .tile .lbl{font-size:9px;letter-spacing:.15em}
[data-layout="terminal"] #stats svg{display:none}
[data-layout="terminal"] #radar-wrap{display:none}
[data-layout="terminal"] #chat{gap:2px;padding:10px 14px}
[data-layout="terminal"] .msg{max-width:100%;flex-direction:row;align-items:baseline;gap:12px;border:0;background:transparent;padding:2px 0;align-self:stretch}
[data-layout="terminal"] .msg .time{order:0;align-self:auto;min-width:64px}
[data-layout="terminal"] .msg .who{order:1;min-width:300px}
[data-layout="terminal"] .msg .text{order:2;font-size:13px;flex:1}
[data-layout="terminal"] .msg.send .text::before{content:"$ ";color:var(--c)}
[data-layout="terminal"] .msg.recv .text::before{content:"< ";color:var(--user)}
[data-layout="terminal"] .msg.sys{text-align:left}
[data-layout="terminal"] .msg.snap{box-shadow:none;border:0;border-left:2px solid var(--gold);padding-left:8px}
[data-layout="terminal"] footer#console{margin:0 16px 12px}

[data-layout="focus"] main#hud{grid-template-columns:1fr 240px}
[data-layout="focus"] #stream{order:0}
[data-layout="focus"] #stats{order:1;grid-template-columns:1fr;align-content:start;gap:8px}
[data-layout="focus"] .tile{padding:8px 12px}
[data-layout="focus"] .tile .val{font-size:28px}
[data-layout="focus"] #radar-wrap{display:none}
[data-layout="focus"] .msg{max-width:60%}
[data-layout="focus"] .msg .text{font-size:16px}
[data-layout="focus"] footer#console{margin:0 16px 12px}

/* ---------- glitch transition ---------- */
body.glitch header,body.glitch main,body.glitch footer{animation:glitch .6s steps(3) 1}
@keyframes glitch{
  0%{clip-path:inset(0 0 0 0);transform:none;filter:none}
  20%{clip-path:inset(10% 0 60% 0);transform:translate(-6px,0);filter:hue-rotate(90deg)}
  40%{clip-path:inset(50% 0 10% 0);transform:translate(6px,0)}
  60%{clip-path:inset(20% 0 40% 0);transform:translate(-3px,1px);filter:hue-rotate(-60deg) saturate(2)}
  80%{clip-path:inset(70% 0 5% 0);transform:translate(2px,-1px)}
  100%{clip-path:inset(0 0 0 0);transform:none;filter:none}
}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:9;padding:10px 26px;border:1px solid var(--c);color:var(--c);
  background:rgba(0,0,0,.7);letter-spacing:.4em;font-size:12px;text-transform:uppercase;text-shadow:var(--glow);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:980px){[data-layout] main#hud{grid-template-columns:1fr!important;grid-template-rows:auto 1fr}#stats{grid-template-columns:repeat(4,1fr)!important;order:0}#stream{order:1}#radar-wrap{display:none}}
/* phone */
@media (max-width:640px){
  header#top{flex-wrap:wrap;gap:8px 14px;padding:10px 12px}
  .brand{font-size:12px;letter-spacing:.2em}
  #hex,.meta span:nth-child(1){display:none}
  .clock{margin-left:auto}#clock{font-size:18px}#date{display:none}
  .meta{min-width:0;flex-direction:row;gap:10px;width:100%;text-align:left}
  main#hud{padding:8px 10px;gap:8px}
  #stats{grid-template-columns:repeat(3,1fr)!important;gap:6px}
  [data-layout] #stats .tile.wide{grid-column:span 1}
  .tile{padding:8px 8px 6px}.tile .lbl{font-size:8px;letter-spacing:.12em}.tile .val{font-size:20px!important}.tile svg{display:none}
  #chat{padding:10px}.msg{max-width:88%!important}.msg .text{font-size:13px!important}
  [data-layout="terminal"] .msg{flex-wrap:wrap;gap:4px 10px}[data-layout="terminal"] .msg .who{min-width:0;width:100%}
  footer#console{margin:0 10px 8px!important}#sys{height:52px;font-size:10px}.hint{display:none}
  #fx-grid{background-size:32px 32px}
}
</style>
</head>
<body>
<div id="bg-stage"><img class="a" alt=""><img class="b" alt=""></div>
<div id="bg-tint"></div><div id="bg-shade"></div>
<canvas id="rain"></canvas>
<div id="fx-grid"></div><div id="fx-scan"></div><div id="fx-vignette"></div>

<header id="top">
  <div class="brand"><span class="logo">◈</span>CHITCHAT <em>//</em> LIVE WALL</div>
  <div class="status"><span class="dot"></span><span id="status-text">OFFLINE</span></div>
  <div id="hex">00 00 00 00</div>
  <div class="clock"><span id="clock">--:--:--</span><span id="date">...</span></div>
  <div class="meta">
    <span>UPTIME <b id="uptime">00:00:00</b></span>
    <span>THEME <b id="theme-name">CYAN</b> · <b id="layout-name">HUD</b></span>
    <span>LINK <b id="link-state">CONNECTING</b></span>
  </div>
</header>

<main id="hud">
  <aside id="stats"></aside>
  <section id="stream" class="panel">
    <div class="panel-title"><i></i>Live traffic <small id="msg-count">0 messages</small></div>
    <div id="chat"><div id="empty"><b>STANDBY</b>waiting for chat activity</div></div>
  </section>
</main>

<footer id="console" class="panel">
  <div class="panel-title"><i></i>System console <small id="bg-note"></small></div>
  <div id="sys"></div>
  <div class="hint">
    <span><b>T</b> theme</span><span><b>L</b> layout</span><span><b>P</b> pause auto-rotate</span>
    <span><b>B</b> background</span><span><b>F</b> fullscreen</span><span><b>C</b> clear screen</span>
  </div>
</footer>
<div id="toast"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var THEMES=["cyan","matrix","crimson","amber","violet","ice"];
var LAYOUTS=["hud","terminal","focus"];
var ROTATE_MS=60000, BG_MS=45000, MAX_MSGS=260;
var qs=new URLSearchParams(location.search);
var themeIdx=Math.max(0,THEMES.indexOf(qs.get("theme"))), layoutIdx=Math.max(0,LAYOUTS.indexOf(qs.get("layout")));
var paused=qs.get("rotate")==="0", rotations=0;
var TILES=[
  {key:"bot_accounts",label:"Total accounts",cls:"",wide:false},
  {key:"running_accounts",label:"Running",cls:"ok"},
  {key:"messages_sent",label:"Messages sent",cls:"",wide:true},
  {key:"snap_tg_sent_count",label:"Snap / TG sent",cls:"gold",wide:true},
  {key:"traffic_users",label:"Traffic users",cls:""},
  {key:"user_send_count",label:"User loaded",cls:""},
  {key:"dead_accounts",label:"Dead / banned",cls:"danger"},
  {key:"skipped_accounts",label:"Skipped",cls:"warn"},
  {key:"user_first_count",label:"User spoke first",cls:"ok"},
  {key:"bot_first_count",label:"Bot opened",cls:""},
  {key:"resting_accounts",label:"Resting / cooldown",cls:"warn",wide:true}
];
var stats={},hist={},tiles={},msgCount=0,connectedAt=Date.now(),bgs=[],bgIdx=0,bgFlip=false,lastKey="";

/* ---------- theme / layout ---------- */
function applyTheme(announce){
  var t=THEMES[themeIdx],l=LAYOUTS[layoutIdx];
  document.documentElement.setAttribute("data-theme",t);
  document.documentElement.setAttribute("data-layout",l);
  $("theme-name").textContent=t.toUpperCase();$("layout-name").textContent=l.toUpperCase();
  document.body.classList.add("glitch");setTimeout(function(){document.body.classList.remove("glitch")},650);
  if(announce)toast(t+" / "+l);
  resizeRain();
}
function nextTheme(manual){themeIdx=(themeIdx+1)%THEMES.length;applyTheme(manual)}
function nextLayout(manual){layoutIdx=(layoutIdx+1)%LAYOUTS.length;applyTheme(manual);scrollChat(true)}
function rotate(){
  if(paused)return;
  rotations++;
  if(rotations%2===0){layoutIdx=(layoutIdx+1)%LAYOUTS.length}
  nextTheme(false);
  scrollChat(true);
}
setInterval(rotate,ROTATE_MS);
var toastT;function toast(s){var el=$("toast");el.textContent=s;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("show")},1400)}

/* ---------- clock / uptime / hex ---------- */
function pad(n){return (n<10?"0":"")+n}
function tick(){
  var d=new Date();
  $("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  $("date").textContent=d.toDateString().toUpperCase();
  var s=Math.floor((Date.now()-connectedAt)/1000);
  $("uptime").textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
}
setInterval(tick,1000);tick();
setInterval(function(){var h="";for(var i=0;i<8;i++){h+=(i?" ":"")+pad(Math.floor(Math.random()*256).toString(16).toUpperCase())}$("hex").textContent=h},180);

/* ---------- stats tiles ---------- */
function buildTiles(){
  var root=$("stats");root.innerHTML="";
  TILES.forEach(function(t){
    var el=document.createElement("div");el.className="tile "+t.cls+(t.wide?" wide":"");
    el.innerHTML='<div class="lbl"></div><div class="val">0</div><div class="bar"><i></i></div><svg viewBox="0 0 84 28" preserveAspectRatio="none"><polyline points=""/></svg>';
    el.querySelector(".lbl").textContent=t.label;
    root.appendChild(el);tiles[t.key]={el:el,val:el.querySelector(".val"),bar:el.querySelector(".bar i"),poly:el.querySelector("polyline"),shown:0};
    hist[t.key]=[];
  });
  var r=document.createElement("div");r.id="radar-wrap";r.className="tile";
  r.innerHTML='<div id="radar"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="cross"></div><div class="cross v"></div><div class="sweep"></div><div class="blip" style="left:38px;top:44px"></div><div class="blip" style="left:82px;top:70px;animation-delay:1.2s"></div><div class="core">0</div><div class="cap">workers online</div></div>';
  root.appendChild(r);
}
function countTo(t,target){
  var from=t.shown;if(from===target){t.val.textContent=target;return}
  var start=performance.now(),dur=600;
  (function step(now){var p=Math.min(1,(now-start)/dur);p=1-Math.pow(1-p,3);var v=Math.round(from+(target-from)*p);t.val.textContent=v;if(p<1)requestAnimationFrame(step);else t.shown=target})(start);
}
function setStats(s){
  if(!s)return;stats=s;
  var total=Math.max(1,s.bot_accounts||0);
  TILES.forEach(function(d){
    var t=tiles[d.key],v=Number(s[d.key]||0);
    if(v!==t.shown){t.el.classList.add("bump");setTimeout(function(){t.el.classList.remove("bump")},700)}
    countTo(t,v);
    var h=hist[d.key];h.push(v);if(h.length>40)h.shift();
    var mx=Math.max.apply(null,h.concat([1])),mn=Math.min.apply(null,h);
    var pts=h.map(function(y,i){var x=h.length>1?i/(h.length-1)*84:84;var yy=mx===mn?14:26-(y-mn)/(mx-mn)*24;return x.toFixed(1)+","+yy.toFixed(1)}).join(" ");
    t.poly.setAttribute("points",pts);
    var ratio;
    if(d.key==="running_accounts"||d.key==="dead_accounts"||d.key==="skipped_accounts"||d.key==="resting_accounts")ratio=v/total;
    else if(d.key==="user_first_count"||d.key==="bot_first_count"){var both=(s.user_first_count||0)+(s.bot_first_count||0);ratio=both?v/both:0}
    else ratio=mx?v/mx:0;
    t.bar.style.width=Math.max(2,Math.min(100,ratio*100))+"%";
  });
  var core=document.querySelector("#radar .core");if(core)core.textContent=s.running_accounts||0;
}

/* ---------- chat stream ---------- */
var ACT=/^(SEND|RECEIVE)\s*\|\s*(.+?)\s*->\s*(.+?)\s*\|\s*message:\s*([\s\S]*)$/;
function fmtTime(iso){var d=iso?new Date(iso):new Date();if(isNaN(d))return "";return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function addMessage(entry,live){
  var chat=$("chat"),empty=$("empty");if(empty)empty.remove();
  var m=ACT.exec(entry.message||""),el=document.createElement("div");
  var who=document.createElement("div");who.className="who";
  var text=document.createElement("div");text.className="text";
  var time=document.createElement("div");time.className="time";time.textContent=fmtTime(entry.time);
  if(m){
    var dir=m[1]==="SEND"?"send":"recv";el.className="msg "+dir;
    var from=document.createElement("b"),arrow=document.createElement("span"),to=document.createElement("span");
    from.textContent=m[2];arrow.className="arrow";arrow.textContent=dir==="send"?"▶":"◀";to.textContent=m[3];
    who.appendChild(from);who.appendChild(arrow);who.appendChild(to);
    var body=m[4]||"";
    if(dir==="send"&&/\b(snap|snapchat|sc|telegram|tg|t\.me)\b/i.test(body))el.classList.add("snap");
    if(live){el.classList.add("fresh");typewrite(text,body);setTimeout(function(){el.classList.remove("fresh")},2500)}
    else text.textContent=body;
    msgCount++;
  }else{
    el.className="msg sys";text.textContent=entry.message||"";
  }
  el.appendChild(who);el.appendChild(text);el.appendChild(time);
  chat.appendChild(el);
  while(chat.children.length>MAX_MSGS)chat.removeChild(chat.firstChild);
  $("msg-count").textContent=msgCount+" messages";
  scrollChat(false);
  if(live){document.body.classList.add("flicker");setTimeout(function(){document.body.classList.remove("flicker")},400)}
}
function typewrite(el,s){
  el.classList.add("cursor");var i=0,n=s.length,step=n>120?3:n>60?2:1;
  (function go(){i=Math.min(n,i+step);el.textContent=s.slice(0,i);scrollChat(false);if(i<n)setTimeout(go,16);else el.classList.remove("cursor")})();
}
function scrollChat(force){var c=$("chat");if(force||c.scrollHeight-c.scrollTop-c.clientHeight<220)c.scrollTop=c.scrollHeight}
function addSys(entry){
  var sys=$("sys"),d=document.createElement("div");
  d.className="l-"+String(entry.level||"info").toLowerCase();d.textContent=fmtTime(entry.time)+" "+(entry.message||"");
  var prev=sys.querySelector(".last");if(prev)prev.classList.remove("last");d.classList.add("last");
  sys.appendChild(d);while(sys.children.length>5)sys.removeChild(sys.firstChild);
}
function onLog(entry,live){
  var lvl=String(entry.level||"info").toLowerCase();
  if(lvl==="activity")addMessage(entry,live);else addSys(entry);
}
function clearScreen(){$("chat").innerHTML='<div id="empty"><b>STANDBY</b>waiting for chat activity</div>';msgCount=0;$("msg-count").textContent="0 messages"}
function setRunning(r){document.body.classList.toggle("online",!!r);$("status-text").textContent=r?"ONLINE":"OFFLINE"}

/* ---------- backgrounds ---------- */
function setBackground(i){
  if(!bgs.length)return;bgIdx=(i+bgs.length)%bgs.length;
  var imgs=document.querySelectorAll("#bg-stage img"),show=imgs[bgFlip?1:0],hide=imgs[bgFlip?0:1];bgFlip=!bgFlip;
  show.onload=function(){show.classList.add("show");hide.classList.remove("show")};
  show.src="/bg/"+encodeURIComponent(bgs[bgIdx])+"?t="+Date.now();
}
setInterval(function(){if(bgs.length>1)setBackground(bgIdx+1)},BG_MS);

/* ---------- matrix rain ---------- */
var cv=$("rain"),cx=cv.getContext("2d"),cols=[],fs=14,chars="01アイウエオカキクケコサシスセソﾀﾁﾂﾃﾄ<>/\\|=+*#$%&@ABCDEF";
function resizeRain(){cv.width=innerWidth;cv.height=innerHeight;var n=Math.floor(cv.width/fs);cols=[];for(var i=0;i<n;i++)cols.push(Math.random()*-80)}
addEventListener("resize",resizeRain);resizeRain();
var lastRain=0;
function rainFrame(ts){
  requestAnimationFrame(rainFrame);
  if(ts-lastRain<(document.body.classList.contains("online")?45:90))return;lastRain=ts;
  var rgb=getComputedStyle(document.documentElement).getPropertyValue("--rain").trim()||"0,229,255";
  cx.fillStyle="rgba(0,0,0,.12)";cx.fillRect(0,0,cv.width,cv.height);
  cx.font=fs+"px "+getComputedStyle(document.documentElement).getPropertyValue("--font");
  var heavy=document.documentElement.getAttribute("data-theme")==="matrix";
  for(var i=0;i<cols.length;i++){
    if(!heavy&&i%2)continue;
    var ch=chars[Math.floor(Math.random()*chars.length)];
    cx.fillStyle="rgb("+rgb+")";cx.fillText(ch,i*fs,cols[i]*fs);
    if(cols[i]*fs>cv.height&&Math.random()>.975)cols[i]=0;cols[i]++;
  }
}
requestAnimationFrame(rainFrame);

/* ---------- data link ---------- */
function loadSnapshot(){
  return fetch("/api/snapshot",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){
    clearScreen();$("sys").innerHTML="";
    setRunning(s.running);setStats(s.stats);
    var logs=(s.logs||[]).slice().sort(function(a,b){return String(a.time).localeCompare(String(b.time))});
    logs.forEach(function(e){onLog(e,false)});
    lastKey=logs.length?logs[logs.length-1].time+"|"+logs[logs.length-1].message:"";
    scrollChat(true);
    bgs=s.backgrounds||[];
    if(bgs.length){setBackground(0);$("bg-note").textContent=bgs.length+" background(s) · "+(s.bg_dir||"")}
    else $("bg-note").textContent="add photos to "+(s.bg_dir||"data\\logwall")+" for a shadow background";
  });
}
var es,backoff=1000;
function connect(){
  $("link-state").textContent="CONNECTING";
  loadSnapshot().catch(function(){}).then(function(){
    es=new EventSource("/events");
    es.onopen=function(){$("link-state").textContent="LIVE";backoff=1000};
    es.onmessage=function(ev){
      var e;try{e=JSON.parse(ev.data)}catch(_){return}
      if(e.type==="log"){var k=e.data.time+"|"+e.data.message;if(k===lastKey)return;lastKey=k;onLog(e.data,true)}
      else if(e.type==="stats")setStats(e.data);
      else if(e.type==="running")setRunning(e.data);
      else if(e.type==="logs_cleared")clearScreen();
    };
    es.onerror=function(){$("link-state").textContent="RECONNECTING";es.close();setTimeout(connect,backoff);backoff=Math.min(10000,backoff*2)};
  });
}

/* ---------- keys ---------- */
addEventListener("keydown",function(ev){
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  switch(ev.key.toLowerCase()){
    case "t":nextTheme(true);break;
    case "l":nextLayout(true);break;
    case "p":paused=!paused;toast(paused?"auto-rotate paused":"auto-rotate on");break;
    case "b":setBackground(bgIdx+1);break;
    case "c":clearScreen();break;
    case "f":if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();break;
  }
});
addEventListener("dblclick",function(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()});

buildTiles();applyTheme(false);connect();
})();
</script>
</body>
